services:
  postgres:
    image: postgres:16-alpine
    container_name: escola-postgres

    environment:
      POSTGRES_USER: escola
      POSTGRES_PASSWORD: escola
      POSTGRES_DB: escola_db

    ports:
      - "5439:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escola -d escola_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: